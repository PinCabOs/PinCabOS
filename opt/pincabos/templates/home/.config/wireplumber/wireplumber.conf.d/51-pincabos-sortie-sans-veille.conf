# PinCabOS — la sortie analogique ne se met jamais en veille.
# PINCABOS_AUDIO_SANS_CRAQUEMENT_V1
#
# PipeWire coupe une sortie silencieuse au bout de quelques secondes et la
# reveille au son suivant : sur un cabinet, chaque reveil du codec est un
# claquement sourd dans les amplis des vibrants et du fronton. La sortie
# reste ouverte en permanence (un flux silencieux ne coute rien).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
