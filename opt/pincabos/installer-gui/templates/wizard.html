<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinCabOS Installer</title>
<style>
.danger-box.soft{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.14);color:inherit}
:root{
  --bg:#050007; --bg2:#160020; --card:#1d0a2e; --border:#5f2a91;
  --accent:#ffb000; --accent2:#ff7a00; --text:#f5f7fa; --muted:#d8b8ff;
  --good:#22c55e; --danger:#ef4444; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,'Segoe UI',Roboto,sans-serif;color:var(--text);
  background:radial-gradient(1200px 700px at 50% -10%, var(--bg2) 0%, var(--bg) 70%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center
}
header{padding:18px 0 4px;text-align:center}
.logo-img{height:210px;filter:drop-shadow(0 8px 30px rgba(255,122,0,.35))}
header .sub{color:var(--muted);margin-top:6px;font-size:1.05rem}
main{width:min(880px,94vw);padding:22px 0 40px}
.step{display:none;animation:fade .25s ease}
.step.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h2{font-size:1.35rem;margin-bottom:18px;color:var(--accent)}
.card{
  background:linear-gradient(180deg,var(--card),#12061f);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.45)
}
.grid{display:grid;gap:14px}
.langs{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.lang,.opt{
  cursor:pointer;text-align:center;padding:22px 10px;border-radius:var(--radius);
  background:var(--card);border:2px solid var(--border);transition:.15s;user-select:none
}
.lang:hover,.opt:hover{border-color:var(--accent);transform:translateY(-2px)}
/* PINCABOS_INSTALLER_FLAGS_V1 */
.lang .flag{display:block;margin:0 auto;width:88px;height:59px;border-radius:7px;
  box-shadow:0 3px 10px rgba(0,0,0,.5);outline:1px solid rgba(255,255,255,.16);
  outline-offset:-1px}
/* petits ecrans / resolutions GOP (cab) : tout doit tenir sans scroll */
@media (max-height:860px){
  .logo-img{height:110px}
  header{padding:8px 0 2px}
  main{padding:8px 0 16px}
  h2{font-size:1.1rem;margin-bottom:10px}
  .lang,.opt{padding:12px 8px}
  .lang .flag{width:66px;height:44px}
  .mon{width:56px;height:38px;margin-bottom:6px}
  .card{padding:12px}
  button{padding:9px 20px;font-size:.95rem}
  .grid{gap:9px}
  .sub{font-size:.9rem}
}
.opt.sel{border-color:var(--accent);background:#2a0f45;box-shadow:0 0 0 2px var(--accent) inset,0 0 18px rgba(255,176,0,.35);position:relative}
.opt.sel::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--accent);font-weight:900;font-size:1.15rem}
button:disabled,.primary:disabled{opacity:.32;filter:grayscale(.9);cursor:not-allowed}
/* PINCABOS_INSTALLEUR_ECRANS_UX_V1 */
.stepno{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#160020;font-weight:800;font-size:.9rem;flex:0 0 26px}
.apply-row{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}
.status{flex:1;min-width:240px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-weight:600;color:var(--muted);line-height:1.35}
.status[data-state=ok]{border-color:var(--good);color:var(--good);background:rgba(34,197,94,.08)}
.status[data-state=err]{border-color:var(--danger);color:#ffb4b4;background:rgba(239,68,68,.08)}
.status[data-state=todo]{border-color:var(--accent);color:var(--accent2)}
.ghost.small{padding:7px 12px;font-size:.88rem}
#screens-next:not(:disabled){box-shadow:0 0 18px rgba(255,138,0,.45)}
/* PINCABOS_INSTALLEUR_EGERIE_V3 + CREDITS_V1 : Miss Tilt dans la marge droite de chaque page,
   derriere le contenu (main passe devant), hauteur liee a l ecran, largeur bornee par la marge */
.egerie{pointer-events:none;user-select:none}
main{position:relative;z-index:1}
.egerie-page{position:fixed;right:1.2vw;bottom:30px;z-index:0;max-height:52vh;max-width:max(120px,calc((100vw - 900px)/2 - 20px));
  filter:drop-shadow(0 0 22px rgba(255,138,0,.28));transition:opacity .18s ease}
.egerie-page.swap{opacity:0}
/* PINCABOS_INSTALLEUR_EGERIE_V3 : sur Termine, Miss Tilt en vedette (grande, a droite, devant le fond) */
body.on-st-done .egerie-page{max-height:90vh;max-width:44vw;right:4vw;bottom:0;filter:drop-shadow(0 0 40px rgba(255,138,0,.45))}
#st-progress .card{position:relative;overflow:hidden;min-height:260px}
.credits{position:fixed;right:14px;bottom:8px;font-size:12px;color:var(--muted);opacity:.75;letter-spacing:.02em}
.hint{color:var(--muted);font-size:.92rem;margin-top:10px;min-height:1.2em}
.mon::before{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:6px;border-radius:3px;background:var(--accent);box-shadow:0 0 8px rgba(255,176,0,.8);z-index:1}
.mon-bas{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:.62rem;
  font-weight:900;letter-spacing:.08em;color:#160020;background:var(--accent);
  margin:0 14px;border-radius:3px;line-height:1.35;z-index:2}
.orients{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
/* PINCABOS_INSTALLEUR_ECRANS_V1 */
.screens{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.scr{padding:14px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);text-align:center}
.scr.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.scr .num{font-size:2.4rem;font-weight:900;color:var(--accent);line-height:1}
.scr .name{font-weight:700;margin-top:4px}.scr .geo{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.scr select{width:100%;min-width:0}
.opt.disk .found{margin-top:6px;font-size:.85rem;color:var(--good);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segb{background:transparent;color:var(--muted);border:1px solid var(--border);padding:9px 14px;border-radius:10px;font-size:.95rem}
.segb.sel{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#160020;border-color:transparent}
.preview{display:flex;align-items:flex-start;gap:6px;min-height:60px;margin:10px 0 4px;overflow-x:auto}
.pv-scr{border:2px solid var(--border);border-radius:6px;background:#0d0318;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.pv-scr span{font-weight:900;color:var(--accent);font-size:1.2rem}.pv-scr small{color:var(--muted);font-size:.7rem;text-align:center}
.pv-scr.playfield{border-color:var(--accent)}
/* PINCABOS_INSTALLEUR_CAB_USAGE_V1 : le playfield est toujours là, chip fixe */
#cab-usage .segb:disabled{opacity:1;filter:none;cursor:default}
.mon{width:74px;height:48px;border:3px solid var(--accent);border-radius:6px;margin:0 auto 10px;position:relative;transition:.2s}
.mon::after{content:"";position:absolute;inset:6px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:3px;opacity:.7}
.rot90{transform:rotate(90deg)}.rot270{transform:rotate(-90deg)}.rot180{transform:rotate(180deg)}
.o-label{font-weight:700}.o-desc{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.row label{min-width:170px;color:var(--muted)}
select,input[type=text]{
  background:#0d0318;border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:10px;font-size:1rem;flex:1;min-width:220px;
  color-scheme:dark;accent-color:var(--accent);font-weight:600
}
select option{background:#0d0318;color:var(--text)}
select:not(:focus){border-color:var(--accent);color:var(--accent)}
input:focus,select:focus{outline:2px solid var(--accent)}
.btns{display:flex;justify-content:space-between;margin-top:22px}
button{
  cursor:pointer;font-size:1.05rem;font-weight:700;border:none;border-radius:12px;
  padding:13px 30px;transition:.15s
}
.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#160020}
.primary:hover{filter:brightness(1.12)}
.primary:disabled{filter:grayscale(.8);cursor:not-allowed}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.danger-box{border:1px solid var(--danger);background:#2a0a12;border-radius:10px;padding:14px;margin:14px 0;color:#ffb4b4;font-weight:700}
.disk{display:flex;justify-content:space-between;align-items:center;padding:16px}
.disk .dev{font-weight:800;color:var(--accent)}
.disk .model{color:var(--muted)}
.sumline{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px dashed #3a1a5e}
.sumline b{color:var(--accent)}
.pbar-wrap{margin:26px 0 8px}
.pbar{height:16px;border-radius:10px;background:#0d0318;border:1px solid var(--border);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent),#ffd64a);transition:width .8s ease;border-radius:10px}
.plabel{margin-top:10px;color:var(--muted);text-align:center;min-height:1.4em}
.loglines{font-family:ui-monospace,monospace;font-size:.8rem;line-height:1.65;color:#b9a3d6;
  max-height:230px;overflow:auto;margin-top:14px;background:#0a0212;border-radius:8px;
  padding:12px 14px;border:1px solid #2a1245}
.loglines div{padding:1px 0;white-space:pre-wrap;word-break:break-word}
.lg-ok{color:#22c55e}
.lg-ok::before{content:"✔ ";font-weight:900}
.lg-warn{color:var(--accent)}
.lg-warn::before{content:"⚠ "}
.lg-err{color:#ef4444;font-weight:700}
.lg-err::before{content:"✖ "}
.lg-step{color:#ffd64a;font-weight:700;margin-top:6px;border-top:1px dashed #2a1245;padding-top:5px}
.lg-trace{color:#6b5490;font-size:.72rem}
.lang:focus-visible,.opt:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{
  outline:3px solid var(--accent);outline-offset:2px}
.done-check{display:block;margin:14px auto 22px;width:130px;height:130px;
  filter:drop-shadow(0 0 18px rgba(255,176,0,.55)) drop-shadow(0 8px 22px rgba(0,0,0,.5))}
.done-check .ring{fill:none;stroke:url(#pcoGrad);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:302;stroke-dashoffset:302;animation:draw .9s ease-out forwards}
.done-check .tick{fill:none;stroke:url(#pcoGrad);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:75;stroke-dashoffset:75;animation:draw .55s ease-out .75s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.demo-tag{position:fixed;top:10px;right:12px;background:var(--danger);color:#fff;font-weight:800;padding:4px 12px;border-radius:8px;font-size:.8rem}
</style>
</head>
<body>
{% if demo %}<div class="demo-tag">DEMO</div>{% endif %}
<header>
  <img class="logo-img" src="/static/pincabos-logo-alpha.png" alt="PinCabOS">
  <div class="sub" id="subtitle">Installer</div>
</header>
<main>

<section class="step active" id="st-lang">
  <h2 data-i18n="choose_lang">Choose your language</h2>
  <div class="grid langs">
    <div class="lang" role="button" tabindex="0" data-lang="fr" title="Français" aria-label="Français"><svg class="flag" viewBox="0 0 60 40" role="img" aria-hidden="true"><rect width="60" height="40" fill="#fff"/><rect width="20" height="40" fill="#002654"/><rect x="40" width="20" height="40" fill="#ce1126"/></svg></div>
    <div class="lang" role="button" tabindex="0" data-lang="en" title="English" aria-label="English"><svg class="flag" viewBox="0 0 60 40" role="img" aria-hidden="true"><clipPath id="uj"><path d="M30,20 L60,40 L60,20 Z M30,20 L60,0 L30,0 Z M30,20 L0,0 L0,20 Z M30,20 L0,40 L30,40 Z"/></clipPath><rect width="60" height="40" fill="#012169"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#c8102e" stroke-width="5" clip-path="url(#uj)"/><path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="13"/><path d="M30,0 V40 M0,20 H60" stroke="#c8102e" stroke-width="8"/></svg></div>
    <div class="lang" role="button" tabindex="0" data-lang="de" title="Deutsch" aria-label="Deutsch"><svg class="flag" viewBox="0 0 60 40" role="img" aria-hidden="true"><rect width="60" height="40" fill="#ffce00"/><rect width="60" height="26.67" fill="#dd0000"/><rect width="60" height="13.33" fill="#000"/></svg></div>
    <div class="lang" role="button" tabindex="0" data-lang="it" title="Italiano" aria-label="Italiano"><svg class="flag" viewBox="0 0 60 40" role="img" aria-hidden="true"><rect width="60" height="40" fill="#fff"/><rect width="20" height="40" fill="#008c45"/><rect x="40" width="20" height="40" fill="#cd212a"/></svg></div>
    <div class="lang" role="button" tabindex="0" data-lang="es" title="Español" aria-label="Español"><svg class="flag" viewBox="0 0 60 40" role="img" aria-hidden="true"><rect width="60" height="40" fill="#aa151b"/><rect y="10" width="60" height="20" fill="#f1bf00"/></svg></div>
  </div>
</section>

<section class="step" id="st-regional">
  <h2 data-i18n="regional"></h2>
  <div class="card">
    <div class="row"><label data-i18n="locale"></label><select id="f-locale"></select></div>
    <div class="row"><label data-i18n="keyboard"></label><select id="f-xkb"></select></div>
    <div class="row"><label data-i18n="timezone"></label><select id="f-tz"></select></div>
  </div>
  <div class="btns"><button class="ghost" onclick="go('st-lang')" data-i18n="back"></button>
  <button class="primary" onclick="loadScreens();go('st-screens')" data-i18n="next"></button></div>
</section>

<section class="step" id="st-screens">
  <h2 data-i18n="screens"></h2>
  <p style="color:var(--muted);margin-bottom:12px" data-i18n="screens_hint"></p>
  <!-- PINCABOS_INSTALLEUR_ECRANS_UX_V1 : trois gestes numerotes, un seul bouton
       d application (primaire, dans sa carte) et un etat qui dit quoi faire -->
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="margin-bottom:0"><span class="stepno">1</span><label data-i18n="cab_usage"></label>
      <div class="seg" id="cab-usage">
        <button type="button" class="segb sel" disabled data-i18n="role_playfield"></button>
        <button type="button" class="segb sel" disabled data-use="backglass" data-i18n="role_backglass"></button>
        <button type="button" class="segb" data-use="fulldmd" data-i18n="role_fulldmd"></button>
        <button type="button" class="segb" data-use="topper" data-i18n="role_topper"></button>
      </div></div>
    <div class="hint" data-i18n="cab_usage_hint"></div>
  </div>
  <div class="card" id="dmd-card" style="margin-bottom:14px;display:none">
    <div class="row" style="margin-bottom:6px"><label data-i18n="dmd_title"></label>
      <div class="seg" id="dmd-types">
        <button type="button" class="segb" data-dmd="zedmd_usb" data-i18n="dmd_zedmd_usb"></button>
        <button type="button" class="segb" data-dmd="zedmd_wifi" data-i18n="dmd_zedmd_wifi"></button>
        <button type="button" class="segb" data-dmd="pin2dmd" data-i18n="dmd_pin2dmd"></button>
        <button type="button" class="segb" data-dmd="none" data-i18n="dmd_none"></button>
      </div></div>
    <div class="hint" data-i18n="dmd_hint" style="margin-top:0"></div>
    <div class="hint" id="dmd-detected"></div>
    <div class="row" id="dmd-port-row" style="display:none;margin-top:10px"><label data-i18n="dmd_port"></label><select id="dmd-port"></select></div>
    <div class="row" id="dmd-addr-row" style="display:none;margin-top:10px"><label data-i18n="dmd_addr"></label><input type="text" id="dmd-addr" placeholder="192.168.1.50" autocomplete="off" spellcheck="false"></div>
    <div class="row" id="dmd-test-row" style="display:none;margin:10px 0 0"><button type="button" class="ghost" id="dmd-test" onclick="testDmd()" data-i18n="dmd_test"></button><span class="hint" id="dmd-status" style="margin:0"></span></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="margin-bottom:6px;justify-content:space-between">
      <div style="display:flex;gap:12px;align-items:center"><span class="stepno">2</span><label data-i18n="screens_roles_title"></label></div>
      <button type="button" class="ghost small" id="btn-identify" onclick="identifyScreens()" data-i18n="identify"></button></div>
    <div class="hint" style="margin:0 0 10px" data-i18n="screens_roles_hint"></div>
    <div class="grid screens" id="screen-list"></div>
  </div>
  <div class="card" style="margin-top:0">
    <!-- PINCABOS_INSTALLEUR_LECTURE_V1 : montage physique (ecrit) / lecture de l assistant (session seulement) -->
    <div class="row" style="margin-bottom:8px"><span class="stepno">3</span><label data-i18n="orient_q"></label>
      <div class="seg" id="rot-seg">
        <button type="button" class="segb sel" data-rot="0" data-i18n="o_up"></button>
        <button type="button" class="segb" data-rot="180" data-i18n="o_down"></button>
      </div></div>
    <div class="hint" style="margin:0 0 10px" data-i18n="orient_hint"></div>
    <div class="row" style="margin-bottom:8px"><label data-i18n="lecture_q"></label>
      <div class="seg" id="lecture-seg">
        <button type="button" class="segb sel" data-lecture="0" data-i18n="l_0"></button>
        <button type="button" class="segb" data-lecture="90" data-i18n="l_90"></button>
        <button type="button" class="segb" data-lecture="270" data-i18n="l_270"></button>
      </div></div>
    <div class="hint" style="margin:0 0 10px" data-i18n="lecture_hint"></div>
    <div class="preview" id="screen-preview"></div>
    <div class="apply-row">
      <button type="button" class="primary" id="btn-apply" onclick="applyScreens()" data-i18n="apply_layout"></button>
      <div class="status" id="screens-status" data-state="todo" data-i18n="screens_pending"></div>
    </div>
  </div>
  <div class="btns"><button class="ghost" onclick="go('st-regional')" data-i18n="back"></button>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="hint" id="screens-next-hint" style="margin:0"></span>
      <button class="primary" id="screens-next" disabled onclick="loadSound();go('st-sound')" data-i18n="next"></button>
    </div></div>
</section>

<section class="step" id="st-sound">
  <h2 data-i18n="sound_title"></h2>
  <p style="color:var(--muted);margin-bottom:12px" data-i18n="sound_hint"></p>
  <div class="card" id="snd-card" style="margin-bottom:14px">
    <div class="row"><label data-i18n="snd_output"></label><select id="snd-out"></select></div>
    <div class="row"><label data-i18n="snd_backbox"></label><select id="snd-bg"></select></div>
    <div class="row"><label data-i18n="snd_mode"></label><select id="snd-mode"></select></div>
    <div class="hint" id="snd-mode-hint" style="margin:-4px 0 10px"></div>
    <div class="row"><label data-i18n="snd_volume"></label><input type="range" id="snd-vol" min="0" max="100" step="5" style="flex:1"><b id="snd-vol-val" style="min-width:3.5em;text-align:right">70 %</b></div>
    <div class="row" style="margin:6px 0 0"><button type="button" class="ghost" id="snd-test" onclick="testSound()" data-i18n="snd_test"></button><span class="hint" id="snd-status" style="margin:0"></span></div>
    <!-- PINCABOS_AUDIO_HP_UN_PAR_UN_V1 : un bouton par haut-parleur du mode choisi -->
    <div class="row" style="margin:10px 0 0"><label data-i18n="snd_speakers"></label><div class="seg" id="snd-speakers"></div></div>
    <div class="hint" id="snd-speakers-hint" style="margin:0"></div>
  </div>
  <div class="card" id="dof-card">
    <div class="row" style="margin-bottom:6px"><label data-i18n="dof_title"></label>
      <div class="seg"><button type="button" class="segb" id="dof-enable" onclick="toggleDof()" data-i18n="dof_enable"></button></div></div>
    <div class="hint" data-i18n="dof_hint" style="margin-top:0"></div>
    <div class="hint" id="dof-detected"></div>
  </div>
  <div class="btns"><button class="ghost" onclick="go('st-screens')" data-i18n="back"></button>
    <button class="primary" onclick="loadToys();go('st-toys')" data-i18n="next"></button></div>
</section>

<section class="step" id="st-toys">
  <h2 data-i18n="toys_title"></h2>
  <p style="color:var(--muted);margin-bottom:12px" data-i18n="toys_hint"></p>
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="margin-bottom:4px"><label data-i18n="toys_inputs"></label><span id="toys-inputs" style="flex:1"></span></div>
    <div class="hint" data-i18n="toys_inputs_note" style="margin-top:0"></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="margin-bottom:4px"><label data-i18n="toys_auto"></label><span id="toys-auto" style="flex:1"></span></div>
  </div>
  <div id="toys-strips"></div>
  <div class="hint" id="toys-status"></div>
  <div class="btns"><button class="ghost" onclick="go('st-sound')" data-i18n="back"></button>
    <button class="primary" id="toys-next" onclick="loadNetwork(false);go('st-network')" data-i18n="next"></button></div>
</section>

<section class="step" id="st-network">
  <h2 data-i18n="network"></h2>
  <p style="color:var(--muted);margin-bottom:12px" data-i18n="network_hint"></p>
  <div id="net-list"></div>
  <div class="card" id="net-wifi" style="margin-top:14px;display:none"></div>
  <div class="hint" id="net-status"></div>
  <div class="btns"><button class="ghost" onclick="go('st-toys')" data-i18n="back"></button>
    <div style="display:flex;gap:10px">
      <button class="ghost" onclick="loadNetwork(true)" data-i18n="net_refresh"></button>
      <button class="primary" id="net-next" onclick="go('st-disk')" data-i18n="next"></button>
    </div></div>
</section>

<section class="step" id="st-disk">
  <h2 data-i18n="disk"></h2>
  <div class="grid" id="disk-list"></div>
  <div class="grid" style="margin-top:16px">
    <div class="opt" data-mode="1" style="text-align:left;padding:16px">
      <b data-i18n="mode_erase"></b><div class="o-desc" data-i18n="mode_erase_d"></div></div>
    <div class="opt" data-mode="2" style="text-align:left;padding:16px">
      <b data-i18n="mode_dual"></b><div class="o-desc" data-i18n="mode_dual_d"></div></div>
    <div class="opt" data-mode="3" style="text-align:left;padding:16px">
      <b data-i18n="mode_up"></b><div class="o-desc" data-i18n="mode_up_d"></div></div>
  </div>
  <div class="hint" id="disk-keep" style="display:none;color:var(--good)"></div>
  <div class="hint" id="disk-hint" data-i18n="disk_hint"></div>
  <div class="btns"><button class="ghost" onclick="go('st-network')" data-i18n="back"></button>
  <button class="primary" id="disk-next" disabled onclick="fillSummary();go('st-confirm')" data-i18n="next"></button></div>
</section>

<section class="step" id="st-confirm">
  <h2 data-i18n="confirm_title"></h2>
  <div class="card" id="summary"></div>
  <div class="danger-box"><span data-i18n="confirm_warn"></span> <span id="confirm-dev"></span></div>
  <div class="row"><label data-i18n="confirm_hint" style="min-width:100%"></label>
    <input type="text" id="confirm-input" autocomplete="off" spellcheck="false"></div>
  <div class="hint" id="confirm-status" style="color:var(--danger)"></div>
  <div class="btns"><button class="ghost" onclick="go('st-disk')" data-i18n="back"></button>
  <button class="primary" id="btn-install" disabled onclick="launch()" data-i18n="start"></button></div>
</section>

<section class="step" id="st-progress">
  <h2 data-i18n="installing"></h2>
  <div class="card">
    <div class="pbar-wrap"><div class="pbar"><i id="pfill"></i></div></div>
    <div class="plabel" id="plabel"></div>
    <div style="text-align:center;margin-top:12px">
      <button class="ghost" id="log-toggle" onclick="toggleLogs()" data-i18n="show_logs"></button>
    </div>
    <div class="loglines" id="plog" style="display:none"></div>
  </div>
</section>

<section class="step" id="st-done">
  <svg class="done-check" viewBox="0 0 120 120">
    <defs><linearGradient id="pcoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd64a"/><stop offset=".55" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff7a00"/></linearGradient></defs>
    <circle class="ring" cx="60" cy="60" r="48"/>
    <path class="tick" d="M38 62 L54 78 L84 44"/>
  </svg>
  <h2 style="text-align:center" data-i18n="install_done"></h2>
  <p style="text-align:center;color:#ffb000;font-weight:600;margin-top:10px" data-i18n="install_remove"></p>
  <div style="text-align:center;margin-top:20px">
    <button class="primary" onclick="fetch('/api/reboot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:'INSTALL PINCABOS'})})" data-i18n="reboot"></button>
  </div>
</section>

</main>
<script>
const I18N={{ i18n|safe }}, DEFAULTS={{ defaults|safe }};
const S={lang:null,locale:null,xkb:null,xkb_variant:"",tz:null,orient:null,mode:null,disk:null};

const LOCALES=["fr_FR.UTF-8","fr_CA.UTF-8","fr_BE.UTF-8","fr_CH.UTF-8","en_US.UTF-8","en_GB.UTF-8","de_DE.UTF-8","de_AT.UTF-8","de_CH.UTF-8","it_IT.UTF-8","it_CH.UTF-8","es_ES.UTF-8","es_MX.UTF-8","es_AR.UTF-8"];
const XKBS=[["fr","Français (AZERTY)"],["us","English (US)"],["gb","English (UK)"],["de","Deutsch (QWERTZ)"],["it","Italiano"],["es","Español"],["ch","Suisse"],["be","Belge"],["ca","Français (Canada)"]];
const TZS=["Europe/Paris","Europe/Brussels","Europe/Zurich","Europe/Berlin","Europe/Vienna","Europe/Rome","Europe/Madrid","Europe/London","America/New_York","America/Montreal","America/Los_Angeles","America/Mexico_City","America/Argentina/Buenos_Aires"];

function t(k){return (I18N[S.lang||"en"]||{})[k]||k}
function applyI18n(){document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.getElementById("subtitle").textContent=t("welcome")}
function go(id){document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active")}
function fillSelect(id,items,val){const s=document.getElementById(id);s.innerHTML="";
  items.forEach(it=>{const [v,l]=Array.isArray(it)?it:[it,it];
    const o=new Option(l,v,false,v===val);s.add(o)})}

document.querySelectorAll(".lang").forEach(el=>el.onclick=()=>{
  S.lang=el.dataset.lang;const d=DEFAULTS[S.lang];
  S.locale=d.locale;S.xkb=d.xkb;S.tz=d.tz;
  fillSelect("f-locale",LOCALES,d.locale);fillSelect("f-xkb",XKBS,d.xkb);fillSelect("f-tz",TZS,d.tz);
  applyKbd();
  applyI18n();go("st-regional")});
function applyKbd(){fetch("/api/keyboard",{method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({xkb:S.xkb,variant:S.xkb_variant||""})}).catch(()=>{})}
["f-locale","f-xkb","f-tz"].forEach(id=>document.getElementById(id).onchange=e=>{
  S[{ "f-locale":"locale","f-xkb":"xkb","f-tz":"tz" }[id]]=e.target.value;
  if(id==="f-xkb")applyKbd()});

// PINCABOS_INSTALLEUR_ECRANS_V1 — étape Écrans : les choix s'accumulent dans la
// page (aperçu immédiat), « Tester la disposition » applique réellement par
// xrandr, « Continuer » ne s'ouvre qu'après une application réussie des choix
// courants. L'assistant suit lui-même l'écran désigné comme playfield.
const ROLE_KEYS=["playfield","backglass","fulldmd","topper"];
// PINCABOS_INSTALLEUR_CAB_USAGE_V1 — le propriétaire déclare ce que son cab
// possède (backglass, full DMD, topper) ; les rôles attribuables, la proposition
// et les réglages d'affichage en aval en découlent.
S.screens={roles:{},rotation:0,lecture:0,usage:{backglass:true,fulldmd:true,topper:false}};
let screensMon=[],screensApplied="",screensIdentifiedOnce=false;
function dalleDe(role){const m=screensMon.find(x=>x.name===S.screens.roles[role]);return m?m.app_index+1:null}
function resumeDisposition(){return usedRoles().filter(r=>dalleDe(r)).map(r=>t("role_"+r)+" → "+t("screens_dalle")+" "+dalleDe(r)).join(" · ")}
function screensKey(){return JSON.stringify([S.screens.roles,S.screens.rotation,S.screens.lecture,S.screens.usage])}
function usageFromRoles(){const u={};ROLE_KEYS.filter(r=>r!=="playfield").forEach(r=>u[r]=!!S.screens.roles[r]);return u}
function usedRoles(){return ROLE_KEYS.filter(r=>r==="playfield"||S.screens.usage[r])}
function missingRoles(){return usedRoles().filter(r=>!S.screens.roles[r])}
function freeMonitors(){const pris=new Set(Object.values(S.screens.roles).filter(Boolean));return screensMon.filter(m=>!pris.has(m.name))}
function autoAssign(role){
  const libres=freeMonitors();if(!libres.length)return;
  const ratio=m=>m.height?m.width/m.height:0;
  const choix=role==="fulldmd"?libres.slice().sort((a,b)=>ratio(b)-ratio(a))[0]:libres.slice().sort((a,b)=>b.width*b.height-a.width*a.height)[0];
  S.screens.roles[role]=choix.name}
// PINCABOS_INSTALLEUR_MINIMUM_V1 : playfield + backglass = minimum, le backglass ne se decoche pas
function renderUsage(){S.screens.usage.backglass=true;document.querySelectorAll("#cab-usage .segb[data-use]").forEach(b=>b.classList.toggle("sel",!!S.screens.usage[b.dataset.use]))}
function toggleUsage(role){
  if(role==="backglass")return;
  S.screens.usage[role]=!S.screens.usage[role];
  if(!S.screens.usage[role]){S.screens.roles[role]=""}else{autoAssign(role)}
  renderUsage();renderScreens();renderDmd();refreshScreensStatus()}
function refreshScreensStatus(){
  const miss=missingRoles();
  if(miss.length){setScreensStatus("screens_missing",false,miss.map(r=>t("role_"+r)).join(", "))}
  else if(!dmdValid()){setScreensStatus("dmd_addr_invalid",false)}
  else if(screensApplied&&screensApplied===screensKey()){setScreensStatus("screens_applied",true,resumeDisposition())}
  else if(screensApplied){setScreensStatus("screens_changed",false)}
  else{setScreensStatus("screens_pending",false)}}
// PINCABOS_INSTALLEUR_DMD_V1 — sans full DMD, le DMD est une matrice LED (ZeDMD,
// PIN2DMD) ou rien : détecté par l'outil du cab, proposé, testable ici même.
S.dmd={type:"none",device:"",wifi_addr:""};
let dmdDet=null;
function dmdShown(){return !S.screens.usage.fulldmd}
function dmdValid(){return !dmdShown()||S.dmd.type!=="zedmd_wifi"||/^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$/.test(S.dmd.wifi_addr||"")}
function loadDmd(){fetch("/api/dmd").then(r=>r.json()).then(d=>{dmdDet=d;
    if(d.proposition&&!S.dmd.touched){S.dmd={...S.dmd,...d.proposition}}
    renderDmd()}).catch(()=>{dmdDet={serie:[],candidats:[],pin2dmd:[]};renderDmd()})}
function renderDmd(){
  const card=document.getElementById("dmd-card");card.style.display=dmdShown()?"":"none";
  if(!dmdShown())return;
  document.querySelectorAll("#dmd-types .segb").forEach(b=>b.classList.toggle("sel",b.dataset.dmd===S.dmd.type));
  const det=dmdDet||{serie:[],candidats:[],pin2dmd:[]};
  const vus=[].concat((det.candidats||[]).map(p=>"ZeDMD "+(p.device||"")+(p.model?" ("+p.model+")":"")),
                      (det.pin2dmd||[]).map(p=>(p.product||"PIN2DMD")+(p.serial?" #"+p.serial:"")));
  document.getElementById("dmd-detected").textContent=vus.length?t("dmd_detected")+" "+vus.join(", "):t("dmd_none_detected");
  const sel=document.getElementById("dmd-port");sel.innerHTML="";
  [["",t("dmd_port_auto")]].concat((det.serie||[]).map(p=>[p.by_id||p.device,(p.device||"")+" · "+(p.label||"")]))
    .forEach(([v,l])=>sel.add(new Option(l,v,false,v===(S.dmd.device||""))));
  document.getElementById("dmd-port-row").style.display=S.dmd.type==="zedmd_usb"?"":"none";
  document.getElementById("dmd-addr-row").style.display=S.dmd.type==="zedmd_wifi"?"":"none";
  document.getElementById("dmd-addr").value=S.dmd.wifi_addr||"";
  document.getElementById("dmd-test-row").style.display=(S.dmd.type==="zedmd_usb"||S.dmd.type==="zedmd_wifi")?"":"none"}
document.querySelectorAll("#dmd-types .segb").forEach(b=>b.onclick=()=>{S.dmd.type=b.dataset.dmd;S.dmd.touched=true;renderDmd();refreshScreensStatus()});
document.getElementById("dmd-port").onchange=e=>{S.dmd.device=e.target.value;S.dmd.touched=true};
document.getElementById("dmd-addr").oninput=e=>{S.dmd.wifi_addr=e.target.value.trim();S.dmd.touched=true;refreshScreensStatus()};
function testDmd(){const st=document.getElementById("dmd-status"),btn=document.getElementById("dmd-test");
  btn.disabled=true;st.textContent=t("dmd_testing");
  fetch("/api/dmd/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(S.dmd)})
  .then(r=>r.json()).then(d=>{btn.disabled=false;st.textContent=d.ok?t("dmd_test_ok"):t("dmd_test_failed")+" "+(d.sortie||"")})
  .catch(()=>{btn.disabled=false;st.textContent=t("dmd_test_failed")})}
document.querySelectorAll("#cab-usage .segb[data-use]").forEach(b=>b.onclick=()=>toggleUsage(b.dataset.use));
function loadScreens(){
  const box=document.getElementById("screen-list");box.innerHTML="<div class='hint'>…</div>";
  fetch("/api/screens").then(r=>r.json()).then(d=>{
    screensMon=d.monitors||[];
    if(d.error||!screensMon.length){box.innerHTML="<div class='hint'>"+t("screens_none")+"</div>";return}
    if(!Object.keys(S.screens.roles).length){S.screens.roles=d.roles||{};S.screens.rotation=d.rotation||0;S.screens.usage=d.usage||usageFromRoles()}
    document.querySelectorAll("#rot-seg .segb").forEach(b=>b.classList.toggle("sel",+b.dataset.rot===+S.screens.rotation));
    renderUsage();renderScreens();loadDmd();refreshScreensStatus();
    // les numeros s affichent d eux-memes sur chaque dalle a l arrivee : on sait qui est qui
    if(!screensIdentifiedOnce){screensIdentifiedOnce=true;setTimeout(identifyScreens,500)}})
  .catch(()=>{box.innerHTML="<div class='hint'>"+t("screens_none")+"</div>"})}
function roleOf(name){return ROLE_KEYS.find(r=>S.screens.roles[r]===name)||""}
function renderScreens(){
  const box=document.getElementById("screen-list");box.innerHTML="";
  screensMon.forEach(m=>{
    const el=document.createElement("div");el.className="scr"+(roleOf(m.name)==="playfield"?" sel":"");
    const opts=[["",t("role_none")]].concat(usedRoles().map(r=>[r,t("role_"+r)]))
      .map(([v,l])=>`<option value="${v}" ${roleOf(m.name)===v?"selected":""}>${l}</option>`).join("");
    el.innerHTML=`<div class="num">${m.app_index+1}</div><div class="name">${m.name}</div>
      <div class="geo">${m.width} × ${m.height}</div>
      <select data-name="${m.name}">${opts}</select>`;
    el.querySelector("select").onchange=e=>{
      const name=e.target.dataset.name,role=e.target.value;
      ROLE_KEYS.forEach(r=>{if(S.screens.roles[r]===name)S.screens.roles[r]=""});
      if(role){S.screens.roles[role]=name}
      renderScreens();refreshScreensStatus()};
    box.appendChild(el)});
  renderPreview()}
function renderPreview(){
  const pv=document.getElementById("screen-preview");const rot=(+S.screens.rotation+(+S.screens.lecture||0))%360;
  const order=ROLE_KEYS.filter(r=>S.screens.roles[r]).map(r=>[r,screensMon.find(m=>m.name===S.screens.roles[r])]).filter(x=>x[1]);
  if(!order.length){pv.innerHTML="<span class='hint'>"+t("screens_need_pf")+"</span>";return}
  const scale=180/Math.max(...order.map(([r,m])=>r==="playfield"&&(rot===90||rot===270)?m.height:m.width));
  pv.innerHTML=order.map(([r,m])=>{const turned=r==="playfield"&&(rot===90||rot===270);
    const w=(turned?m.height:m.width)*scale,h=(turned?m.width:m.height)*scale;
    return `<div class="pv-scr ${r}" style="width:${w}px;height:${h}px"><span>${m.app_index+1}</span><small>${t("role_"+r)}${r==="playfield"&&rot?" · "+rot+"°":""}</small></div>`}).join("")}
document.querySelectorAll("#rot-seg .segb").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#rot-seg .segb").forEach(o=>o.classList.remove("sel"));b.classList.add("sel");
  S.screens.rotation=+b.dataset.rot;renderPreview();refreshScreensStatus()});
document.querySelectorAll("#lecture-seg .segb").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#lecture-seg .segb").forEach(o=>o.classList.remove("sel"));b.classList.add("sel");
  S.screens.lecture=+b.dataset.lecture;renderPreview();refreshScreensStatus()});
function setScreensStatus(key,ok,extra){const st=document.getElementById("screens-status");
  st.textContent=t(key)+(extra?" "+extra:"");
  st.dataset.state=ok?"ok":key==="screens_failed"?"err":key==="screens_applying"?"busy":"todo";
  const next=document.getElementById("screens-next");
  next.disabled=!(ok&&screensApplied===screensKey()&&S.screens.roles.playfield&&!missingRoles().length&&dmdValid());
  document.getElementById("screens-next-hint").textContent=next.disabled?t("screens_next_hint"):""}
function applyScreens(){
  if(!S.screens.roles.playfield){setScreensStatus("screens_need_pf",false);return}
  if(missingRoles().length){refreshScreensStatus();return}
  const btn=document.getElementById("btn-apply");btn.disabled=true;setScreensStatus("screens_applying",false);
  fetch("/api/screens/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(S.screens)})
  .then(r=>r.json()).then(d=>{btn.disabled=false;
    if(d.ok){screensApplied=screensKey();setScreensStatus("screens_applied",true,resumeDisposition());identifyScreens()}
    else{screensApplied="";setScreensStatus("screens_failed",false,(d.erreurs||[]).join(" ; "))}})
  .catch(()=>{btn.disabled=false;screensApplied="";setScreensStatus("screens_failed",false)})}
// PINCABOS_INSTALLEUR_SON_DOF_V1 — étape Son et DOF : sorties ALSA de la
// session (mêmes cartes que le système installé), test immédiat, mode VPX,
// volume ; cartes DOF détectées, DOF activé si l'une d'elles est vue.
S.sound={playfield:"",backbox:"",sound3d:"0",volume:70};
S.dof={enabled:true};
let sndDevs=[],sndModes=[],dofDet=[];
function loadSound(){fetch("/api/sound").then(r=>r.json()).then(d=>{
    sndDevs=(d.audio&&d.audio.devices)||[];sndModes=(d.audio&&d.audio.modes)||[];dofDet=(d.dof&&d.dof.detected)||[];
    if(!S.sound.touched&&d.audio&&d.audio.proposition){S.sound={...S.sound,...d.audio.proposition}}
    if(!S.dof.touched&&d.dof&&d.dof.proposition){S.dof.enabled=!!d.dof.proposition.enabled}
    renderSound()}).catch(()=>{sndDevs=[];sndModes=[];dofDet=[];renderSound()})}
function renderSound(){
  const out=document.getElementById("snd-out"),bg=document.getElementById("snd-bg"),mode=document.getElementById("snd-mode");
  out.innerHTML="";bg.innerHTML="";mode.innerHTML="";
  if(!sndDevs.length){out.add(new Option(t("snd_none"),""));bg.add(new Option(t("snd_none"),""))}
  else{sndDevs.forEach(d=>out.add(new Option(d.label,d.id,false,d.id===S.sound.playfield)));
    bg.add(new Option(t("snd_same"),"",false,!S.sound.backbox||S.sound.backbox===S.sound.playfield));
    sndDevs.forEach(d=>bg.add(new Option(d.label,d.id,false,d.id===S.sound.backbox&&d.id!==S.sound.playfield)))}
  sndModes.forEach(([v,l])=>mode.add(new Option(t("sound3d_"+v)||l,v,false,v===String(S.sound.sound3d))));
  // PINCABOS_AUDIO_SSF_EXPLICITE_V1 : ce que le mode choisi exige, en clair
  const hint=document.getElementById("snd-mode-hint");if(hint){hint.textContent=t("sound3d_hint_"+S.sound.sound3d)||t("snd_mode_hint")}
  document.getElementById("snd-vol").value=S.sound.volume;document.getElementById("snd-vol-val").textContent=S.sound.volume+" %";
  document.getElementById("snd-test").disabled=!S.sound.playfield;
  renderSpeakers();
  document.getElementById("dof-enable").classList.toggle("sel",!!S.dof.enabled);
  document.getElementById("dof-detected").textContent=dofDet.length?t("dof_detected")+" "+dofDet.map(c=>c.kind+(c.serial?" #"+c.serial:"")).join(", ")+(dofDet.some(c=>c.strip)?" — "+t("dof_strip_note"):""):t("dof_none")}
document.getElementById("snd-out").onchange=e=>{S.sound.playfield=e.target.value;S.sound.touched=true;if(S.sound.backbox===S.sound.playfield)S.sound.backbox="";renderSound()};
document.getElementById("snd-bg").onchange=e=>{S.sound.backbox=e.target.value;S.sound.touched=true};
document.getElementById("snd-mode").onchange=e=>{S.sound.sound3d=e.target.value;S.sound.touched=true;renderSound()};
document.getElementById("snd-vol").oninput=e=>{S.sound.volume=+e.target.value;S.sound.touched=true;document.getElementById("snd-vol-val").textContent=S.sound.volume+" %"};
document.getElementById("snd-vol").onchange=e=>{fetch("/api/sound/volume",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:S.sound.playfield,volume:S.sound.volume})}).catch(()=>{})};
const HP_NOMS={FL:"hp_fl",FR:"hp_fr",RL:"hp_rl",RR:"hp_rr",C:"hp_c",LFE:"hp_lfe",SL:"hp_sl",SR:"hp_sr"};
const HP_ORDRE={2:["FL","FR"],6:["FL","FR","RL","RR","C","LFE"]};
function canauxPourMode(m){return (String(m)==="0"||String(m)==="1")?2:6}
function renderSpeakers(){const box=document.getElementById("snd-speakers");box.innerHTML="";
  const n=canauxPourMode(S.sound.sound3d);
  HP_ORDRE[n].forEach((hp,i)=>{const b=document.createElement("button");b.type="button";b.className="segb";b.textContent=t(HP_NOMS[hp]);
    b.disabled=!S.sound.playfield;b.onclick=()=>testSpeaker(i,n,b);box.appendChild(b)});
  document.getElementById("snd-speakers-hint").textContent=t(n===2?"snd_speakers_hint2":"snd_speakers_hint6")}
function testSpeaker(i,n,btn){const st=document.getElementById("snd-speakers-hint");
  document.querySelectorAll("#snd-speakers .segb").forEach(b=>b.disabled=true);st.textContent=t("snd_testing")+" "+btn.textContent;
  fetch("/api/sound/test-channel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:S.sound.playfield,channels:n,channel:i})})
  .then(r=>r.json()).then(d=>{st.textContent=(d.ok?t("snd_speaker_ok"):t("snd_test_failed"))+" "+(d.canal||btn.textContent)+(d.ok?"":" — "+(d.sortie||""));st.style.color=d.ok?"var(--good)":"var(--danger)"})
  .catch(()=>{st.textContent=t("snd_test_failed")}).finally(()=>document.querySelectorAll("#snd-speakers .segb").forEach(b=>b.disabled=!S.sound.playfield))}
function testSound(){const st=document.getElementById("snd-status"),btn=document.getElementById("snd-test");btn.disabled=true;st.textContent=t("snd_testing");

// (code + détail), le bouton redevient actif ; avant, il était avalé en silence.
function launchRefused(d,status){const st=document.getElementById("confirm-status");
  st.textContent=t("install_refused")+" "+(d&&d.error?d.error:"HTTP "+status)+(d&&d.detail?" — "+[].concat(d.detail).join(" ; "):"");

function launch(){
  const st=document.getElementById("confirm-status");st.textContent="";document.getElementById("btn-install").disabled=true;
  fetch("/api/install",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({...S,confirm:document.getElementById("confirm-input").value})})
  .then(r=>{if(!r.ok){return r.json().catch(()=>({})).then(d=>launchRefused(d,r.status))}
    go("st-progress");startCreep();t0=Date.now();
    document.getElementById("plabel").dataset.base=t("progress_start");
    const es=new EventSource("/api/progress");
    es.onmessage=ev=>{const d=JSON.parse(ev.data);
      floorPct=Math.max(floorPct,d.pct);
      if(floorPct>shownPct){shownPct=floorPct;drawPct(shownPct)}
      if(d.label)document.getElementById("plabel").dataset.base=d.label;
      if(d.log){const pl=document.getElementById("plog"),ln=document.createElement("div");
        let txt=d.log,cls="";
        if(/^GO(\s|\[)/.test(txt)){cls="lg-ok";txt=txt.replace(/^GO\s*\[[^\]]*\]\s*/,"")}
        else if(/^WARN/.test(txt)){cls="lg-warn";txt=txt.replace(/^WARN\s*\[[^\]]*\]\s*/,"")}
        else if(/^(NOGO|ERROR|ERREUR|FAIL)/i.test(txt)){cls="lg-err"}
        else if(/^TRACE/.test(txt)){cls="lg-trace"}
        else if(/^(Etape|Step|Partition|Extract|Final|Install|Creating|Unmount)/i.test(txt)){cls="lg-step"}
        if(cls)ln.className=cls;
        ln.textContent=txt;pl.appendChild(ln);
        while(pl.childElementCount>400)pl.removeChild(pl.firstChild);
        pl.scrollTop=pl.scrollHeight}
      if(d.pct>=100){clearInterval(creepTimer);drawPct(100);es.close();applyI18n();go("st-done")}}})
  .catch(()=>launchRefused(null,"réseau"))}

    e.preventDefault();e.target.click()}});
